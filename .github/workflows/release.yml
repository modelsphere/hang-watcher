# Public release: a version tag builds the image and pushes it to Docker Hub.
#
# The internal image is built separately by .gitlab-ci.yml and goes to harbor.
# Both build the same Dockerfile; only the base-image build args and the
# destination registry differ. Every base here already defaults to a public
# image, so this side passes no overrides.
#
# Tags in this repo have no `v` prefix (0.1.24), so both shapes trigger.
#
# Credentials come from the organisation secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]*'

permissions: {}

env:
  IMAGE_0: 4pdosc/hang-watcher

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # latest is what someone gets when they ask for no version in particular,
      # so a prerelease tag (0.1.0-rc1) builds without taking it.
      - name: Work out the tags to push
        id: tags
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) echo "prerelease ${version}: not tagging latest" ;;
          esac
          {
            echo "t0<<T_EOF"
            echo "${IMAGE_0}:${version}"
            case "$version" in
              *-*) ;;
              *) echo "${IMAGE_0}:latest" ;;
            esac
            echo "T_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push hang-watcher
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.t0 }}
