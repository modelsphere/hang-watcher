# Adding hang-watcher to a plain Deployment. Reference example -- adapt the
# names, ports and image before applying anything.
#
# What it does:
#   1. a startupProbe on the engine container, so a slow model load is not
#      mistaken for a hang
#   2. a livenessProbe on the engine container pointing at the sidecar's
#      /healthz -- 503 means the kubelet restarts the engine container
#   3. the sidecar itself, plus the ConfigMap from configmap.yaml
#
# The sidecar only reports. It never calls the Kubernetes API and needs no RBAC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-engine
  namespace: default
spec:
  template:
    spec:
      containers:
        - name: engine                          # vLLM or sglang, serving on 8000
          # 1. startup gate: no liveness or readiness until the model is loaded
          startupProbe:
            httpGet: { path: /v1/models, port: 8000 }
            periodSeconds: 15
            failureThreshold: 80                # 80 x 15s = 20 min load budget
            timeoutSeconds: 10
          # 2. the kill trigger: ask the sidecar, not the engine
          livenessProbe:
            httpGet: { path: /healthz, port: 9090 }
            periodSeconds: 5
            failureThreshold: 2
          # keep whatever readinessProbe you already have

        # 3. the sidecar
        - name: hang-watcher
          image: 4pdosc/hang-watcher:0.1.22   # pin a real tag
          env:
            - { name: ENGINE_URL,  value: "http://127.0.0.1:8000" }
            - { name: CONFIG_FILE, value: "/etc/hang-watcher/config.json" }
            # Optional log confirmation. Kubernetes writes a container's stdout
            # to /var/log/pods/<ns>_<pod>_<uid>/<container>/N.log, where N grows
            # with rotation -- hence the glob. Leave LOG_FILE unset to disable.
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NS,   valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: LOG_FILE, value: "/var/log/pods/$(POD_NS)_$(POD_NAME)_*/engine/*.log" }
          ports:
            - { containerPort: 9090, name: hang-hz }
          resources:
            requests: { cpu: "10m",  memory: "16Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
          volumeMounts:
            - { name: hang-watcher-config, mountPath: /etc/hang-watcher, readOnly: true }
            # read-only host mount, only to read the engine container's stdout
            - { name: pod-logs, mountPath: /var/log/pods, readOnly: true }
      volumes:
        - name: hang-watcher-config
          configMap: { name: hang-watcher-config }
        - name: pod-logs
          hostPath: { path: /var/log/pods, type: Directory }
